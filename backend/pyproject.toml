[project]
name = "aos"
version = "0.1.0"
description = "AOS POC: kernel, worker, gateway, scheduler, mock connectors and CLI"
requires-python = ">=3.12"
# Data access is psycopg 3 with plain SQL and numbered SQL migrations (see README, "Deviations").
dependencies = [
  "fastapi>=0.140",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
  "psycopg[binary,pool]>=3.2",
  "mcp>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# The agent runtime arrives in M1; M0 runs without it.
runtime = ["langgraph>=0.2", "langchain-core>=0.3", "langgraph-checkpoint-postgres>=2.0"]
dev = ["ruff>=0.6", "jsonschema>=4.23"]  # jsonschema: contract tests

[project.scripts]
aos = "aos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aos"]

[tool.ruff]
line-length = 110
