apiVersion: aos/v1
kind: Policy
metadata: {name: sourcing_supervised, version: 1, owner: risk}
spec:
  type: authority_profile
  grants:
    - {resource: job_artifacts, actions: [read, draft, version], effect: ALLOW}
    - {resource: erp_supplier, actions: [read], effect: ALLOW}
    - {resource: erp_po, actions: [read], effect: ALLOW}
    - {resource: erp_po, actions: [create], effect: REQUIRE_APPROVAL}
    - {resource: mailbox, actions: [read, draft], effect: ALLOW}
    - {resource: mailbox, actions: [send], effect: REQUIRE_APPROVAL}
    - {resource: quotes, actions: [read], effect: ALLOW}
