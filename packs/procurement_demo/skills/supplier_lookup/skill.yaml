apiVersion: aos/v1
kind: Skill
metadata: {name: supplier_lookup, version: 2, owner: head_of_procurement}
spec:
  work_types: [analysis]
  instructions: instructions.md
  ceiling: shareable
  budget: {tokens: 50000, cost_usd: 1.2, seconds: 300, steps: 10, actions: 10, retries: 2}
  reads: [job_snapshot, brief]
  produces: [supplier_list]
  may_request: [search_suppliers, get_supplier_history]
  verifiers: [sources_cited]
  runs:
    analysis:
      classification_ceiling: shareable
      budget: {tokens: 50000, cost_usd: 1.20, time_s: 300, steps: 10, actions: 10, retries: 2}
