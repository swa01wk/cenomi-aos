apiVersion: aos/v1
kind: Skill
metadata: {name: sourcing_assist, version: 5, owner: head_of_procurement}
spec:
  work_types: [analysis]
  instructions: instructions.md
  ceiling: restricted
  budget: {tokens: 30000, cost_usd: 0.75, seconds: 180, steps: 30, actions: 18, retries: 3}
  reads: [job_snapshot, recent_messages, supplier_list]
  produces: []
  may_request: [read_artifact, browse_categories, get_supplier_history]
