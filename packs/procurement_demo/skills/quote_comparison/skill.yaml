apiVersion: aos/v1
kind: Skill
metadata: {name: quote_comparison, version: 2, owner: head_of_procurement}
spec:
  work_types: [analysis, record_update]
  instructions: instructions.md
  ceiling: restricted
  budget: {tokens: 80000, cost_usd: 1.5, seconds: 300, steps: 24, actions: 14, retries: 2}
  reads: [job_snapshot, brief, quote, comparison]
  produces:
    [
      quote_line_matrix,
      quote_line_scores,
      quote_eval_commercial,
      quote_eval_technical,
      quote_evaluation,
      technical_criterion_scores,
      commercial_criterion_scores,
      eval_scoring_policy,
      comparison,
      po_payload,
    ]
  may_request: [price_calculator, create_po, find_po]
  verifiers: [score_recompute]
  runs:
    analysis:
      classification_ceiling: restricted
      budget: {tokens: 80000, cost_usd: 1.50, time_s: 300, steps: 24, actions: 14, retries: 2}
    record_update:
      classification_ceiling: restricted
      budget: {tokens: 80000, cost_usd: 1.50, time_s: 600, steps: 24, actions: 14, retries: 3}
