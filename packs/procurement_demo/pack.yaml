apiVersion: aos/v1
kind: Pack
metadata:
  name: procurement_demo
  version: 40
  owner: head_of_procurement
spec:
  kernel: aos/v1
  description: Quick Quote and formal RFP sourcing on the Sourcing Agent — RFQ/RFP intake
    through purchase order.
  observability:
    stage_targets:
      awaiting_quotes: 5d
      comparison: 1d
    approval_due_default: 1d
    seat_alerts:
      never_rate_per_day: 3
      rework_rate: 0.15
    prompt_capture: false
