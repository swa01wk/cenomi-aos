apiVersion: aos/v1
kind: ToolProvider
metadata: {name: mock_erp, version: 1, owner: platform_admin}
spec:
  description: Mock ERP for categories, suppliers and purchase orders, served as an MCP server.
  transport: mcp
  endpoint: ${MCP_MOCK_ERP_URL}
  tools:
    browse_categories: {resource: erp_supplier, action: read, class: read}
    search_suppliers: {resource: erp_supplier, action: read, class: read}
    get_supplier_history: {resource: erp_supplier, action: read, class: read}
    find_po: {resource: erp_po, action: read, class: read}
    create_po: {resource: erp_po, action: create, class: committed_effect, reconcile_with: find_po}
  governance: {require_policy_evaluation: true, allow_direct_runtime_credentials: false}
