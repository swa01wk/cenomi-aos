apiVersion: aos/v1
kind: ArtifactType
metadata: {name: quote_evaluation, version: 1, owner: head_of_procurement}
spec:
  description: Weighted Quick Quote scores (commercial and technical) for award.
  fields:
    rank: {type: integer, required: true}
    supplier: {type: string, required: true}
    supplier_id: {type: string, required: true}
    total: {type: money, required: true, classification: restricted}
    lead_time_days: {type: integer, required: true}
    commercial_score: {type: number, required: true}
    technical_score: {type: number, required: true}
    weighted_score: {type: number, required: true}
    commercial_weight: {type: number}
    technical_weight: {type: number}
  row_based: true
  row_key: supplier_id
  view:
    type: sheet
    columns: [rank, supplier, commercial_score, technical_score, weighted_score, total, lead_time_days]
  visibility:
    buyer: all
    procurement_approver: all
    requester: [rank, supplier, commercial_score, technical_score, weighted_score, lead_time_days]
