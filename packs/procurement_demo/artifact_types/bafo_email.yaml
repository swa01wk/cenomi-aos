apiVersion: aos/v1
kind: ArtifactType
metadata: {name: bafo_email, version: 1, owner: head_of_procurement}
spec:
  description: Best-and-final offer negotiation message to one supplier (module-level challenges).
  fields:
    supplier_id: {type: string, required: true}
    to: {type: string, required: true}
    subject: {type: string, required: true}
    body: {type: text, required: true}
  item_key: supplier_id
  classification: shareable
  view: {type: message_composer}
  visibility:
    buyer: all
    procurement_approver: all
    category_manager: all
