name: live

# The same evals and journeys as ci.yml, on the real model. Nightly, on demand, and from uat-release.yml.
# Evidence for UAT: eval report per skill and a video of every journey run (kept 30 days).
#
# Needs repository secrets OPENAI_API_KEY and OPENAI_MODEL, and variables AOS_MODEL_PRICE_IN_PER_MTOK and
# AOS_MODEL_PRICE_OUT_PER_MTOK (or the worker refuses to start). Cost scales with runs: see docs/ops/CI.md.
on:
  schedule:
    - cron: "30 20 * * 0-4" # 02:00 IST, Mon–Fri mornings
  workflow_dispatch:
    inputs:
      eval_runs:
        description: real-model runs per eval scenario
        default: "5"
      journey_runs:
        description: real-model runs per journey
        default: "2"
      journeys:
        description: run the Playwright journeys too
        type: boolean
        default: true
  workflow_call:
    inputs:
      eval_runs:
        type: string
        default: "5"
      journey_runs:
        type: string
        default: "5"
    secrets:
      OPENAI_API_KEY:
        required: true
      OPENAI_MODEL:
        required: true

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e 'backend[dev,runtime]'
      - uses: ./.github/actions/aos-stack
        with:
          runtime: langgraph
          vendor-sim: "1"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-model: ${{ secrets.OPENAI_MODEL }}
          price-in: ${{ vars.AOS_MODEL_PRICE_IN_PER_MTOK }}
          price-out: ${{ vars.AOS_MODEL_PRICE_OUT_PER_MTOK }}
      - name: make eval LIVE=1
        env:
          AOS_API_URL: http://localhost:8000/api
        run: make eval LIVE=1 N=${{ inputs.eval_runs || '5' }}
      - name: Summary
        if: always()
        run: python scripts/ci-summary.py evals eval-results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-live
          path: eval-results/
          retention-days: 30
      - uses: ./.github/actions/aos-stack-teardown
        if: always()
        with:
          name: live-evals
          job-status: ${{ job.status }}

  live-journeys:
    if: github.event_name != 'workflow_dispatch' || inputs.journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # Handover targets: Quick Quote closes in 4 of 5 live runs, the RFP reaches award in 3 of 5.
          - journey: quick-quote
            min_rate: "0.8"
          - journey: rfp
            min_rate: "0.6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - uses: ./.github/actions/aos-stack
        with:
          runtime: langgraph
          vendor-sim: "1"
          demo: "0"
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-model: ${{ secrets.OPENAI_MODEL }}
          price-in: ${{ vars.AOS_MODEL_PRICE_IN_PER_MTOK }}
          price-out: ${{ vars.AOS_MODEL_PRICE_OUT_PER_MTOK }}
      - name: Setup (stops 1–3, once)
        working-directory: web
        env:
          CI: "1"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test -c playwright.journeys.config.ts --project=stop-03
      - name: Journey ${{ matrix.journey }} on the real model
        working-directory: web
        continue-on-error: true # the pass-rate check below is the gate, not a single failed run
        env:
          CI: "1"
          E2E_LIVE: "1"
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:8000
        # --no-deps: stops 1–3 already ran; repeat only the journey, each run a new job on the same Seat.
        run: >-
          npx playwright test -c playwright.journeys.config.ts --project=${{ matrix.journey }} --no-deps
          --repeat-each=${{ inputs.journey_runs || '2' }}
      - name: Demo parity on the last live RFP job
        if: matrix.journey == 'rfp' && hashFiles('web/journey-results/rfp-instance.txt') != ''
        continue-on-error: true # reported in the summary; the pass rate below is the gate
        env:
          E2E_API_URL: http://localhost:8000
        run: bash scripts/verify-demo-rfp.sh "$(cat web/journey-results/rfp-instance.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pass rate
        run: >-
          python3 scripts/ci-summary.py playwright web/journey-results/results.json
          --title "Journey ${{ matrix.journey }} (real model)" --min-rate ${{ matrix.min_rate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-${{ matrix.journey }}-live
          path: |
            web/playwright-report-journeys/
            web/journey-results/
          retention-days: 30
      - uses: ./.github/actions/aos-stack-teardown
        if: always()
        with:
          name: live-journey-${{ matrix.journey }}
          job-status: ${{ job.status }}
