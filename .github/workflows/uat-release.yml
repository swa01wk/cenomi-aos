name: uat-release

# Tag vX.Y.Z-uat (e.g. v0.3.0-uat) → full CI on the scripted model → live evals and journeys (5 runs each) →
# a GitHub release carrying the evidence → deploy to the UAT host after a manual approval (environment "uat").
#
# Repository setup (docs/ops/CI.md): secrets OPENAI_API_KEY, OPENAI_MODEL, UAT_HOST, UAT_USER, UAT_SSH_KEY,
# UAT_SSH_KNOWN_HOSTS; variables AOS_MODEL_PRICE_IN_PER_MTOK, AOS_MODEL_PRICE_OUT_PER_MTOK, UAT_URL, UAT_DIR;
# environment "uat" with required reviewers.
on:
  push:
    tags: ["v*-uat"]
  # Re-run for an existing tag: Actions → uat-release → Run workflow → "Use workflow from" = the tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  live:
    needs: ci
    uses: ./.github/workflows/live.yml
    with:
      eval_runs: "5"
      journey_runs: "5"
    secrets: inherit

  release:
    needs: [ci, live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package evidence (eval reports, journey reports and videos)
        run: |
          mkdir -p evidence
          cp -r artifacts/eval-results-* artifacts/journey-* evidence/ 2>/dev/null || true
          [ -n "$(ls -A evidence)" ] || { echo "::error::no evidence artifacts found"; exit 1; }
          (cd evidence && zip -qr "../uat-evidence-${TAG}.zip" .)
          ls -la "uat-evidence-${TAG}.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/ops/RELEASE_NOTES.md
          [ -f "$notes" ] || { echo "Release notes: see CHANGELOG.md" > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "$TAG" "uat-evidence-${TAG}.zip" --title "$TAG (UAT)" --notes-file "$notes" --prerelease \
            || gh release upload "$TAG" "uat-evidence-${TAG}.zip" --clobber

  deploy-uat:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: ${{ vars.UAT_URL }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: SSH key
        env:
          KEY: ${{ secrets.UAT_SSH_KEY }}
          KNOWN: ${{ secrets.UAT_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_uat && chmod 600 ~/.ssh/id_uat
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Deploy ${{ env.TAG }}
        env:
          HOST: ${{ secrets.UAT_HOST }}
          USER: ${{ secrets.UAT_USER }}
          DIR: ${{ vars.UAT_DIR || '/srv/cenomi-aos' }}
        # The host keeps its own .env (real-model key, AOS_DEMO=0, AOS_VENDOR_SIM=1, AOS_SYNC_PACK_ON_START=0).
        run: |
          ssh -i ~/.ssh/id_uat "$USER@$HOST" "set -e; cd '$DIR'; git fetch --tags --force; git checkout -q '$TAG'; make up"
      - name: Smoke check
        env:
          URL: ${{ vars.UAT_URL }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$URL/api/healthz" && exit 0
            sleep 10
          done
          echo "::error::UAT host did not become healthy at $URL"; exit 1
