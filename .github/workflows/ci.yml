name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      AOS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AOS_TEST_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e 'backend[dev,runtime]'
      - name: Tests (contracts, reference DDL, pack-neutral, kernel, API, connectors, worker)
        run: make test
      - name: Validate the pack
        run: make validate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm ci
      - name: Generated API types match the contract
        working-directory: web
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Type-check and build
        working-directory: web
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies and Chromium
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Mint worker token
        env:
          AOS_WORKER_TOKEN: unused
        run: |
          TOKEN=$(docker compose -f deploy/docker-compose.yml run --rm --no-deps api aos worker-token --worker-id e2e-worker)
          echo "AOS_WORKER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Start stack (postgres, api, web, mock-erp, worker)
        env:
          AOS_FAKE_SCRIPT: request_intake.happy.yaml
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait postgres api web mock-erp worker
      - name: Playwright e2e
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
      - name: Stack logs and teardown
        if: always()
        env:
          AOS_WORKER_TOKEN: unused
        run: |
          docker compose -f deploy/docker-compose.yml logs --tail=200 api web worker || true
          docker compose -f deploy/docker-compose.yml down -v
