name: ci

# Every PR and every push to main. Required checks on main (branch ruleset): backend, web, evals, e2e-core,
# e2e-journeys (quick-quote), e2e-journeys (rfp), e2e-journeys (negative). See docs/ops/CI.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      AOS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AOS_TEST_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e 'backend[dev,runtime]'
      - name: Tests (contracts, reference DDL, pack-neutral, kernel, API, connectors, worker, simulate)
        run: |
          set -o pipefail
          # Failures also become annotations, readable on the PR without the job log.
          make test 2>&1 | tee test.log || { python scripts/unittest-annotations.py test.log; exit 1; }
      - name: Validate the pack (errors and warnings)
        run: |
          cd backend
          python -m aos.cli validate ../packs/procurement_demo --org ../seed/org.yaml --json > ../validate.json || true
          cd ..
          python scripts/ci-summary.py validate validate.json
      - name: Lint (ruff, report only until the slice clean-up lands)
        continue-on-error: true
        run: cd backend && ruff check --output-format=github src tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Generated API types match the contract
        working-directory: web
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Type-check and build
        working-directory: web
        run: npm run build

  evals:
    # Agent eval suite on the scripted model: every scenario must pass. The real-model run is in live.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e 'backend[dev,runtime]'
      - name: Is the eval runner built yet?
        id: runner
        run: |
          if (cd backend && python -m aos.cli eval --help >/dev/null 2>&1); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=evals::aos eval is not built yet (UAT slice day 4); job passes without running."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/aos-stack
        if: steps.runner.outputs.ready == 'true'
        with:
          runtime: fake
          vendor-sim: "1"
      - name: make eval
        if: steps.runner.outputs.ready == 'true'
        env:
          AOS_API_URL: http://localhost:8000/api
        run: make eval
      - name: Summary
        if: always() && steps.runner.outputs.ready == 'true'
        run: python scripts/ci-summary.py evals eval-results/report.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.runner.outputs.ready == 'true'
        with:
          name: eval-results-scripted
          path: eval-results/
          retention-days: 14
      - uses: ./.github/actions/aos-stack-teardown
        if: always() && steps.runner.outputs.ready == 'true'
        with:
          name: evals
          job-status: ${{ job.status }}

  e2e-core:
    # Walkthrough stops 1–5 (publish, Seat tests, activate, new job, chat) on the scripted model.
    # Playwright 1.51 does not ship browser builds for ubuntu 26 yet (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - uses: ./.github/actions/aos-stack
        with:
          runtime: fake
          fake-script: request_intake.happy.yaml
      - name: Playwright stops 1–5
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-core
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
      - uses: ./.github/actions/aos-stack-teardown
        if: always()
        with:
          name: e2e-core
          job-status: ${{ job.status }}

  e2e-journeys:
    # Lifecycle journeys on the scripted model, vendors simulated by mail, AOS_DEMO=0 (no heals, no demo endpoints).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        journey: [quick-quote, rfp, negative]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - uses: ./.github/actions/aos-stack
        with:
          runtime: fake
          vendor-sim: "1"
          demo: "0"
      - name: Journey ${{ matrix.journey }}
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:8000
        # --pass-with-no-tests until the journey specs land (slice day 8); then remove it so an empty run fails.
        run: npx playwright test -c playwright.journeys.config.ts --project=${{ matrix.journey }} --pass-with-no-tests
      - name: Demo parity (the live RFP job has everything the client demo showed)
        if: matrix.journey == 'rfp' && hashFiles('web/journey-results/rfp-instance.txt') != ''
        env:
          E2E_API_URL: http://localhost:8000
        run: bash scripts/verify-demo-rfp.sh "$(cat web/journey-results/rfp-instance.txt)"
      - name: Summary
        if: always()
        run: python3 scripts/ci-summary.py playwright web/journey-results/results.json --title "Journey ${{ matrix.journey }} (scripted model)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-${{ matrix.journey }}-scripted
          path: |
            web/playwright-report-journeys/
            web/journey-results/
          retention-days: 14
      - uses: ./.github/actions/aos-stack-teardown
        if: always()
        with:
          name: journey-${{ matrix.journey }}
          job-status: ${{ job.status }}

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (advisory until the dev-secret baseline is reviewed; see docs/ops/CI.md)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
