name: AOS stack teardown
description: On failure, surface api and worker logs as annotations; always save logs as an artifact and stop the stack.

inputs:
  name:
    description: artifact name suffix for the saved logs
    required: true
  job-status:
    description: "pass job.status; 'failure' adds the log annotations"
    default: success

runs:
  using: composite
  steps:
    - name: Stack logs as annotations
      if: inputs.job-status == 'failure'
      shell: bash
      run: |
        for svc in api worker; do
          body=$(docker compose -f deploy/docker-compose.yml logs --no-color --tail=120 "$svc" 2>&1 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=$svc logs (last 120 lines)::$body"
        done
    - name: Save stack logs
      shell: bash
      run: |
        mkdir -p stack-logs
        for svc in api worker web mock-erp mock-mail; do
          docker compose -f deploy/docker-compose.yml logs --no-color "$svc" > "stack-logs/$svc.log" 2>&1 || true
        done
    - uses: actions/upload-artifact@v4
      with:
        name: stack-logs-${{ inputs.name }}
        path: stack-logs/
        retention-days: 7
    - name: Stop stack
      shell: bash
      run: docker compose -f deploy/docker-compose.yml down -v || true
